[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-blockchainiq"
version = "0.1.0"
description = "LangChain tools for Blockchain IQ's pay-per-call crypto data API (x402, USDC on Base). Made by ScrapeMole."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "ScrapeMole" }]
requires-python = ">=3.10"
dependencies = [
  "langchain-core>=1.7.3,<2",
  "x402[evm]>=2.26.0,<3",
  "eth-account>=0.14.0,<1",
  "requests>=2.34.2,<3",
]

[project.optional-dependencies]
test = ["pytest>=9.2.0,<10"]

[project.urls]
Homepage = "https://scrapemole.pages.dev/bounties/"

[tool.setuptools]
packages = ["langchain_blockchainiq"]
